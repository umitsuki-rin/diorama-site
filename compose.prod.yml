name: ${PROJECT_NAME}

services:
  db:
    env_file:
      - db.prod.env
    ports:
      - "3307:3306"

  web:
    build: .
    volumes:
      - log-data:/rails/log
      - storage-data:/rails/storage
    env_file:
      - web.prod.env
    ports:
      - "3000:3000"

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    depends_on:
      - web

  certbot:
    image: certbot/certbot
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
volumes:
  log-data:
  storage-data: