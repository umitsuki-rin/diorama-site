name: ${PROJECT_NAME}

services:
  db:
    env_file:
      - db.prod.env
  web:
    build: .
    volumes:
      - log-data:/rails/log
      - storage-data:/rails/storage
    env_file:
      - web.prod.env

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:z
      - ./certbot/conf:/etc/letsencrypt:z
      - ./certbot/www:/var/www/certbot:z
    depends_on:
      - web

  certbot:
    image: certbot/certbot
    profiles: ["tools"]
    volumes:
      - ./certbot/conf:/etc/letsencrypt:z
      - ./certbot/www:/var/www/certbot:z

volumes:
  log-data:
  storage-data: