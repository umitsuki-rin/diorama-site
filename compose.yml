services:
  db:
    image: mysql:${MYSQL_VERSION}
    volumes:
      - db_data:/var/lib/mysql
    environment:
      TZ: Asia/Tokyo

  web:
    build:
      context: .
      args:
        RUBY_VERSION: ${RUBY_VERSION}
    depends_on:
      - db
    environment:
      TZ: Asia/Tokyo
    ports:
      - "3000:3000"
    tty: true

volumes:
  db_data: