services:
  db:
    environment:
      MYSQL_ALLOW_EMPTY_PASSWORD: "yes"

  web:
    build:
      context: .
      dockerfile: Dockerfile.dev
    volumes:
      - .:/app
      - vendor_bundle:/app/vendor/bundle
      - node_modules:/app/node_modules
    environment:
      DB_HOST: db
    command: /bin/sh -c "while :; do sleep 10; done"

volumes:
  vendor_bundle:
  node_modules: